plugins {
    id 'application'
}

group = 'com.vojtechruzicka'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        // Latest LTS. Auto-provisioned by the foojay resolver if not installed locally.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // CLI parsing with subcommands (pair / test / run).
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // JSON for Hue API + config file.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // Logging.
    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.vojtechruzicka.lights.cli.LightsCli'
    // The Hue bridge uses a self-signed cert without a SAN; hostname verification against
    // its IP must be off before the first HttpClient is created. Baked into run + scripts.
    applicationDefaultJvmArgs = ['-Djdk.internal.httpclient.disableHostnameVerification=true']
}

tasks.named('test') {
    useJUnitPlatform()
}
